version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: daily

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - '*'
    cooldown:
      default-days: 7
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: npm
    directory: /
    patterns:
      - '*'
    cooldown:
      default-days: 7
    multi-ecosystem-group: all-dependencies
